apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-apache-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2-apache
  template:
    metadata:
      labels:
        app: app2-apache
    spec:
      containers:
      - name: nginx
        image: nginx:stable-alpine
        command: ["/bin/sh", "-c"]
        args:
        - echo "app2" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
        ports:
        - containerPort: 80
