apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: all-apps-ingress
spec:
  rules:
  - host: "app1.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-nginx-service
            port:
              number: 80
  - host: "app2.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app2-apache-service
            port:
              number: 80
  - host: "app3.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app3-whoami-service
            port:
              number: 80