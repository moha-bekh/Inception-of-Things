apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-whoami-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3-whoami
  template:
    metadata:
      labels:
        app: app3-whoami
    spec:
      containers:
      - name: nginx
        image: nginx:stable-alpine
        command: ["/bin/sh", "-c"]
        args:
        - echo "app3" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
        ports:
        - containerPort: 80
